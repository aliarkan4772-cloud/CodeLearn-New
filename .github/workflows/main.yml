name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Arrange project
        run: |
          set -e
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p gradle/wrapper

          mv "build.gradle (7).kts" app/build.gradle.kts
          mv proguard-rules.pro app/proguard-rules.pro
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv colors.xml strings.xml themes.xml app/src/main/res/values/
          mv ic_launcher_foreground.xml app/src/main/res/drawable/
          mv ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/
          mv ic_launcher_round.xml app/src/main/res/mipmap-anydpi-v26/
          rm -f "ic_launcher (25).xml" "ic_launcher_round (26).xml"
          mv libs.versions.toml gradle/libs.versions.toml
          mv gradle-wrapper.properties gradle/wrapper/gradle-wrapper.properties

          for f in *.kt; do
            [ -e "$f" ] || continue
            pkg=$(grep -m1 '^package ' "$f" | sed 's/^package //; s/[;\r]//g' | tr -d ' ' | tr '.' '/')
            if [ -z "$pkg" ]; then pkg="com/codelearn/app"; fi
            mkdir -p "app/src/main/java/$pkg"
            mv "$f" "app/src/main/java/$pkg/"
          done

          sed -i 's/\r$//' settings.gradle.kts build.gradle.kts gradle.properties app/build.gradle.kts
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-bin.zip|' gradle/wrapper/gradle-wrapper.properties

          echo "===== ROOT build.gradle.kts ====="
          cat build.gradle.kts
          echo "===== settings.gradle.kts ====="
          cat settings.gradle.kts
          echo "===== app/build.gradle.kts ====="
          cat app/build.gradle.kts
          echo "===== TREE ====="
          find app -type f | sort

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: CodeLearn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
