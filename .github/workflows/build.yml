name: Build CodeLearn APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Organize Files
        run: |
          mkdir -p app/src/main/java/com/codelearn/app/ui/screens
          mkdir -p app/src/main/java/com/codelearn/app/ui/theme
          mkdir -p app/src/main/java/com/codelearn/app/data/model
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          mv MainActivity.kt app/src/main/java/com/codelearn/app/
          mv CodeLearnApp.kt app/src/main/java/com/codelearn/app/ui/
          mv SplashScreen.kt app/src/main/java/com/codelearn/app/ui/screens/
          mv LanguagePickerScreen.kt app/src/main/java/com/codelearn/app/ui/screens/
          mv RoadmapScreen.kt app/src/main/java/com/codelearn/app/ui/screens/
          mv Color.kt app/src/main/java/com/codelearn/app/ui/theme/
          mv Type.kt app/src/main/java/com/codelearn/app/ui/theme/
          mv Theme.kt app/src/main/java/com/codelearn/app/ui/theme/
          mv Language.kt app/src/main/java/com/codelearn/app/data/model/

          mv strings.xml app/src/main/res/values/
          mv colors.xml app/src/main/res/values/
          mv themes.xml app/src/main/res/values/
          mv ic_launcher.xml app/src/main/res/drawable/
          mv ic_launcher_foreground.xml app/src/main/res/drawable/
          mv ic_launcher_round.xml app/src/main/res/drawable/
          mv ic_launcher_*.xml app/src/main/res/mipmap-anydpi-v26/

          mv AndroidManifest.xml app/src/main/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeLearn-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
