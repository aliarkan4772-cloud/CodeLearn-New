name: Build CodeLearn APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Organize Files Automatically
        run: |
          mkdir -p app/src/main/java/com/codelearn/app/ui/screens
          mkdir -p app/src/main/java/com/codelearn/app/ui/theme
          mkdir -p app/src/main/java/com/codelearn/app/data/model
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          find . -maxdepth 1 -name "*.kt" -exec mv {} app/src/main/java/com/codelearn/app/ \;
          find . -maxdepth 1 -name "*.xml" -exec mv {} app/src/main/res/values/ \;
          mv "build.gradle (7).kts" app/build.gradle.kts || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeLearn-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
